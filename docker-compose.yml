# `docker compose up` (or `podman compose up` -- see docs/plan.md for the
# Podman/SELinux specifics verified on this machine) is the only setup step.
#
# `ingest` is a one-shot service to be added in Phase 2, once the ingestion
# script it runs exists.

services:
  db:
    # Fully qualified, not the short name "postgres:17-alpine" -- this
    # host has short-name-mode=enforcing with multiple candidate registries
    # (see /etc/containers/registries.conf), so an unqualified name blocks
    # on an interactive prompt Podman can't issue without a TTY. Correct
    # under Docker too; it just isn't ambiguous there.
    image: docker.io/library/postgres:17-alpine
    environment:
      # Superuser bootstrap credentials, used only by the (future) `migrate`
      # service to create the app's non-superuser role -- see P9 in
      # docs/assumptions.md. Local-only dev values; never used at runtime.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_only
      POSTGRES_DB: billingtest
    ports:
      # Loopback-only. api reaches db over the compose network via service
      # DNS (db:5432) regardless of host publishing -- this is purely for
      # local `psql` debugging from the host, so it must not bind wider
      # than 127.0.0.1. A bare '5432:5432' binds all interfaces.
      - '127.0.0.1:5432:5432'
    volumes:
      # Named volume, not a bind mount -- required on SELinux Enforcing
      # (bind mounts need :z/:Z relabeling) and avoids rootless Podman's
      # UID-mapped ownership issues on bind mounts. See docs/plan.md.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      target: migrate
    environment:
      # Bootstrap superuser, not app_user -- migrations create app_user
      # (via CREATE ROLE) and RLS policies, both of which require elevated
      # privileges the runtime API role deliberately doesn't have. See
      # ADR 0006.
      MIGRATE_DATABASE_URL: postgres://postgres:postgres_dev_only@db:5432/billingtest
      # The password migrations assign to the app_user role they create.
      # Must match the credential api's DATABASE_URL below authenticates
      # with -- local-only dev value, not a real secret.
      APP_USER_PASSWORD: app_user_dev_password
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    environment:
      # Points at app_user, created by the migrate service above (which
      # must run first). Connecting as the superuser would silently bypass
      # RLS (P9).
      DATABASE_URL: postgres://app_user:app_user_dev_password@db:5432/billingtest
      PORT: '3000'
      HOST: '0.0.0.0'
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      # ⚠️ Verified on this machine: podman-compose 1.6.0 does NOT gate
      # startup on this condition -- `api` and `migrate` were observed
      # starting within ~46ms of each other against a cold volume, well
      # before `migrate` (which takes several seconds) had finished. This
      # stays here because it's correct per the Compose spec and does work
      # under real `docker compose`, and it documents intent either way.
      # Currently harmless because src/server.ts never queries the database
      # at startup (connections are lazy) -- but Phase 3's handlers will
      # query eagerly per-request, so a request arriving in that ~few-second
      # window would hit "password authentication failed for user app_user"
      # (the role migrate hasn't created yet), not a clean 503. Phase 3
      # needs its own mitigation (a startup readiness gate or a
      # retry-on-connect in src/db/connection.ts) rather than trusting this
      # condition under Podman.
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
